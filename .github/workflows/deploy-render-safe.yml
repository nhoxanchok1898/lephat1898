name: Deploy to Render - Safe Staged

on:
  workflow_dispatch: {}

jobs:
  validate:
    name: Validate Render credentials
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.check.outputs.valid }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: check
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$RENDER_SERVICE_ID" ] || [ -z "$RENDER_API_KEY" ]; then
            echo "valid=false" >> $GITHUB_OUTPUT
            echo "Missing Render secrets" >&2
            exit 1
          fi
          http_code=$(curl -sS -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/services/$RENDER_SERVICE_ID") || true
          echo "HTTP_CODE=${http_code:-000}" > validation_status.txt || true
          if [ "$http_code" != "200" ]; then
            echo "valid=false" >> $GITHUB_OUTPUT
            echo "Service check HTTP $http_code" >&2
            exit 1
          fi
          echo "valid=true" >> $GITHUB_OUTPUT

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-validation
          path: validation_status.txt

  deploy-manual:
    name: Deploy to Render (manual)
    if: always()
    runs-on: ubuntu-latest
    # This job is intended to be triggered manually via workflow_dispatch.
    steps:
      - uses: actions/checkout@v4
      - name: Prepare payload
        run: |
          cat > render_payload.json <<'JSON'
{"clearCache": true}
JSON
      - name: Show curl command (dry-run)
        run: |
          echo "curl -v -X POST https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys -H 'Authorization: Bearer ****' -H 'Content-Type: application/json' --data-binary @render_payload.json"
      - name: Trigger deploy (REAL)
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          # allow failures so we always capture curl output
          set +e
          RENDER_API_KEY_CLEAN=$(printf "%s" "$RENDER_API_KEY" | tr -d '\r' || true)
          RENDER_SERVICE_ID_CLEAN=$(printf "%s" "$RENDER_SERVICE_ID" | tr -d '\r' || true)
          http_code=$(curl --retry 3 --retry-delay 5 --retry-connrefused -sS -o /dev/null -w "%{http_code}" -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID_CLEAN/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY_CLEAN" \
            -H "Accept: application/json")
          curl_exit=$?
          {
            echo "SERVICE_ID_PRESENT=$([ -n "$RENDER_SERVICE_ID_CLEAN" ] && echo yes || echo no)"
            echo "API_KEY_PRESENT=$([ -n "$RENDER_API_KEY_CLEAN" ] && echo yes || echo no)"
            echo "HTTP_CODE=${http_code:-000}"
            echo "CURL_EXIT=$curl_exit"
          } > deploy_status.txt || true
          # restore errexit for subsequent steps
          set -e

      - name: Ensure debug status exists
        if: always()
        run: |
          test -f deploy_status.txt || echo "MISSING: deploy_status.txt" > deploy_status.txt

      - name: Upload deploy artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-deploy-debug
          path: deploy_status.txt
