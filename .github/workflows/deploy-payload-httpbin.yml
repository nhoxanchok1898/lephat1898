name: Deploy Payload HTTPBin Test

on:
  workflow_dispatch: {}

jobs:
  httpbin-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare payload
        run: |
          cat > render_payload.json <<'JSON'
{"clearCache": true}
JSON
      - name: Send payload to httpbin
        run: |
          set -euo pipefail
          http_code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST https://httpbin.org/post \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --data-binary @render_payload.json)
          echo "HTTP_CODE=${http_code:-000}" > httpbin_status.txt
      - name: Upload httpbin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: httpbin-debug
          path: httpbin_status.txt
