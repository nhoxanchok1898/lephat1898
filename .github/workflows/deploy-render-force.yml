name: Deploy to Render - Force Capture

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  force-deploy:
    name: Force deploy and capture logs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare payload
        run: |
          cat > render_payload.json <<'JSON'
{"clearCache": true}
JSON
      - name: Force trigger deploy (always)
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          # ensure we don't exit on error so logs are captured
          set +e
          RENDER_API_KEY_CLEAN=$(printf "%s" "$RENDER_API_KEY" | tr -d '\r' || true)
          RENDER_SERVICE_ID_CLEAN=$(printf "%s" "$RENDER_SERVICE_ID" | tr -d '\r' || true)
          RENDER_DEPLOY_HOOK_CLEAN=$(printf "%s" "$RENDER_DEPLOY_HOOK" | tr -d '\r' || true)

          echo "Triggering Render deploy (hook present? ${RENDER_DEPLOY_HOOK_CLEAN:+yes})"

          if [ -n "$RENDER_DEPLOY_HOOK_CLEAN" ]; then
            http_code=$(curl --retry 3 --retry-delay 5 --retry-connrefused -sS -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_CLEAN" \
              -H "Authorization: Bearer $RENDER_API_KEY_CLEAN" \
              -H "Accept: application/json")
            curl_exit=$?
          elif [ -n "$RENDER_SERVICE_ID_CLEAN" ]; then
            http_code=$(curl --retry 3 --retry-delay 5 --retry-connrefused -sS -o /dev/null -w "%{http_code}" -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID_CLEAN/deploys" \
              -H "Authorization: Bearer $RENDER_API_KEY_CLEAN" \
              -H "Accept: application/json")
            curl_exit=$?
          else
            http_code=000
            curl_exit=127
          fi
          {
            echo "DEPLOY_HOOK_PRESENT=$([ -n "$RENDER_DEPLOY_HOOK_CLEAN" ] && echo yes || echo no)"
            echo "SERVICE_ID_PRESENT=$([ -n "$RENDER_SERVICE_ID_CLEAN" ] && echo yes || echo no)"
            echo "API_KEY_PRESENT=$([ -n "$RENDER_API_KEY_CLEAN" ] && echo yes || echo no)"
            echo "HTTP_CODE=${http_code:-000}"
            echo "CURL_EXIT=$curl_exit"
          } > deploy_status.txt

          # restore errexit behavior for remaining steps
          set -e

      - name: Ensure debug status exists
        run: |
          test -f deploy_status.txt || echo "MISSING: deploy_status.txt" > deploy_status.txt

      - name: Upload deploy logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-deploy-debug
          path: deploy_status.txt
