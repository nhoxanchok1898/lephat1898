name: Render Deploy (Manual Debug)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show context
        run: |
          echo "EVENT=$GITHUB_EVENT_NAME"
          echo "ACTOR=$GITHUB_ACTOR"

      - name: Prepare payload
        run: |
          echo '{"clearCache": true}' > render_payload.json

      - name: Trigger Render deploy (REAL)
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set +e
          http_code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json")
          curl_exit=$?
          {
            echo "SERVICE_ID_PRESENT=$([ -n "$RENDER_SERVICE_ID" ] && echo yes || echo no)"
            echo "API_KEY_PRESENT=$([ -n "$RENDER_API_KEY" ] && echo yes || echo no)"
            echo "HTTP_CODE=${http_code:-000}"
            echo "CURL_EXIT=$curl_exit"
          } > deploy_status.txt

      - name: Upload deploy artifacts
        uses: actions/upload-artifact@v4
        with:
          name: render-deploy-manual-debug
          path: deploy_status.txt
