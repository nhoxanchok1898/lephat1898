databases:
  - name: lephat-db
    plan: free
    databaseName: lephat
    user: lephat

services:
  - type: web
    name: lephat1898
    runtime: python
    plan: free
    region: singapore
    buildCommand: "bash build.sh"
    startCommand: "gunicorn paint_store.wsgi:application --bind 0.0.0.0:$PORT --workers 3"
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: paint_store.settings_production
      - key: DATABASE_URL
        fromDatabase:
          name: lephat-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: RENDER_EXTERNAL_HOSTNAME
        value: lephat1898.onrender.com
      - key: ALLOWED_HOSTS
        value: lephat1898.onrender.com
      - key: SITE_URL
        value: https://lephat1898.onrender.com
      - key: USE_MANIFEST_STATICFILES
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLIC_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
